name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No eslint config detected (no eslint.config.js or .eslintrc*).
      # Using flat-config style invocation (no --ext flag).
      # Once eslint is added to devDependencies and a config created,
      # this will lint src/ according to that config.
      - name: ESLint
        run: npx eslint src/

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # sidecar/ directory does not exist yet; these checks will
      # start succeeding once task 0.3 creates it with Python files.
      - name: Ruff lint
        run: ruff check sidecar/
      - name: Ruff format
        run: ruff format --check sidecar/

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cargo check
        run: cargo check --all-targets
        working-directory: src-tauri
      - name: Frontend build
        run: npm run build
